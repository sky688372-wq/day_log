name: Build hotspot test APK

on:
  push:
    tags: ['hotspot-*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build release APK for the Windows hotspot
        run: flutter build apk --release --build-name=1.0.1 --build-number=2 --dart-define=API_SERVER_ADDRESS=http://192.168.137.1:8000
      - name: Verify packaged INTERNET permission
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest permissions "$APK" | grep -F android.permission.INTERNET
          cp "$APK" day-log-hotspot.apk
          sha256sum day-log-hotspot.apk > day-log-hotspot.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: day-log-hotspot
          path: |
            day-log-hotspot.apk
            day-log-hotspot.apk.sha256
      - name: Publish tagged APK
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" day-log-hotspot.apk day-log-hotspot.apk.sha256 --title "Day Log hotspot connection fix" --notes "Test APK: release INTERNET permission and local HTTP support. Default backend: http://192.168.137.1:8000. Uses a new debug signing certificate; an existing installation may require uninstall/reinstall."
